bucket_definitions:
  # One bucket per user. `request.user_id()` reads the `sub` claim out of the
  # JWT the client connected with, so a client only ever gets handed the rows
  # matching their own account -- this is the actual security boundary during
  # sync, not Postgres RLS (see the migration's note on the powersync_role's
  # bypassrls for why RLS can't apply at the replication layer).
  #
  # profiles has no bucket here: it's not a PowerSync table at all, the app
  # reads/writes it directly via supabase-js. ui_state has no bucket either:
  # it's declared localOnly in lib/powersync/schema.ts and never leaves the
  # device by design (see that file's comment on why).
  user_notes:
    parameters: select request.user_id() as user_id
    data:
      - select * from notes where user_id = bucket.user_id

  # Folders, keyed the same way notes are. A separate bucket rather than extra
  # rows in user_notes: buckets are per-table, and the client schema declares
  # `folders` as its own table.
  #
  # `select *` includes `name`, which is an enc:v1 envelope. The service
  # replicates it as opaque text -- it has no idea it is ciphertext and does
  # not need to, which is the whole point.
  user_folders:
    parameters: select request.user_id() as user_id
    data:
      - select * from folders where user_id = bucket.user_id

  # Settings, Stage 13b. Same per-user keying as the two above.
  #
  # WHY THESE SYNC AT ALL, since every other per-device preference does not:
  # Adam's call, 2026-08-25 -- settings follow the user across devices, and the
  # forcing case is the web lock, which has to inherit whatever was set on the
  # phone.
  #
  # `value` is JSON in a text column and is NOT encrypted, unlike folders.name.
  # A preference is structure, not content -- the same category as sort_order
  # and include_in_notes, which have always synced in the clear. See the
  # migration for the full reasoning and for what that does expose.
  #
  # NOTE the boot ordering this creates on web, which is not obvious: the synced
  # value cannot be read before the database is open, and on web the database
  # needs the vault unlocked. So the lock setting is read from its local mirror
  # at boot and reconciled from here afterwards. See lib/settings/.
  user_settings:
    parameters: select request.user_id() as user_id
    data:
      - select * from user_settings where user_id = bucket.user_id
