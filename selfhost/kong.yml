_format_version: '2.1'
_transform: true

# Kong routes one public port to the right internal service, and checks the
# `apikey` header before it does. This file is a TEMPLATE: ${SUPABASE_ANON_KEY}
# and ${SUPABASE_SERVICE_KEY} are expanded by the shell wrapper in
# docker-compose.yml, because Kong does not read environment variables in a
# declarative config.
#
# Two consumers, matching the two keys:
#   anon         -- what the app ships with. Safe to publish; RLS is the real
#                   boundary, and the migration grants table privileges to
#                   `authenticated` only, never to `anon`.
#   service_role -- bypasses RLS entirely. Server-side scripts only. If this
#                   key reaches a client, every row is readable.

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${SUPABASE_ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SUPABASE_SERVICE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # --- GoTrue -------------------------------------------------------------
  # These three routes are open (no key-auth) because they are the ones a
  # browser is redirected to mid-flow, where no apikey header can be attached:
  # email confirmation links, OAuth callbacks, and the OAuth authorize step.
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths: ['/auth/v1/verify']
    plugins:
      - name: cors

  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths: ['/auth/v1/callback']
    plugins:
      - name: cors

  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths: ['/auth/v1/authorize']
    plugins:
      - name: cors

  # Everything else on GoTrue -- signup, OTP request, token exchange, user
  # update -- requires an apikey. Either key is accepted; which one you hold
  # determines nothing here, only downstream at the database.
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths: ['/auth/v1/']
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
          key_names: ['apikey']
      - name: acl
        config:
          hide_groups_header: true
          allow: ['admin', 'anon']

  # --- PostgREST ----------------------------------------------------------
  # profiles, user_keys and the plaintext-endpoint tables. Notes do not travel
  # this path; they go through PowerSync.
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: ['/rest/v1/']
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
          key_names: ['apikey']
      - name: acl
        config:
          hide_groups_header: true
          allow: ['admin', 'anon']
